<section class="mt-6 rounded-2xl border border-line bg-white p-5 sm:p-7">
  <h2 class="text-xl font-semibold">Account</h2>
  <p class="mt-2 text-sm text-muted">
    Archiving disables your access and stops notifications. Your account data is retained.
  </p>
  @if (confirming()) {
    <p class="mt-4">
      Archive <strong class="break-all">{{ email() }}</strong> and sign out?
    </p>
    <div class="mt-4 flex flex-wrap gap-3">
      <button
        type="button"
        class="rounded-lg bg-red-700 px-4 py-2 text-white"
        [disabled]="busy()"
        [attr.aria-busy]="busy()"
        (click)="archive()"
      >
        {{ busy() ? 'Archiving…' : 'Confirm archive' }}
      </button>
      <button
        type="button"
        class="rounded-lg border border-line px-4 py-2"
        [disabled]="busy()"
        (click)="confirming.set(false)"
      >
        Cancel
      </button>
    </div>
  } @else {
    <button
      type="button"
      class="mt-4 rounded-lg border border-line px-4 py-2 text-red-700"
      (click)="confirming.set(true)"
    >
      Archive account
    </button>
  }
  @if (error()) {
    <p class="mt-3 text-sm text-red-700" role="alert">{{ error() }}</p>
  }
</section>
